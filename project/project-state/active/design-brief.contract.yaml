# Design-brief contract — hp-world-champs. Tokens = hp-bricks kit (real HP
# brick colors, contrast-verified); theme.json and the s6 build derive from this.

contract: design-brief
project: "hp-world-champs"
direction: "D1"
date: "2026-07-13"

canvas:
  size: "1280x720"
  background: "#F7F1E3"          # parchment (Tan brick tint)

tokens:
  surface: "#FFFFFF"
  ink: "#05131D"                 # Black brick
  ink_secondary: "#6C6E68"       # Dark Bluish Gray brick
  hairline: "#DCD2BD"
  accent: "#720E0F"              # Dark Red brick
  good: "#184632"                # Dark Green brick
  bad: "#A95500"                 # Dark Orange brick
  neutral_data: "#6C6E68"
  categorical: ["#AA7F2E", "#720E0F", "#184632", "#0A3463", "#AA7D55", "#6C6E68"]
  radius_px: 12                  # v2: was 8 — card wells + cardVisuals
  shadow: "subtle outer: ~10% black, small blur — baked into background wells; cardVisual dropShadow Outer/90D-transparency"  # v2: was none
  grid: "8px base; 24px page margin; 16px gutter"
  # --- v2 "Storybook App" amendment (user-directed uplift, 2026-07-14) ---
  app_bar: "#05131D"             # dark web-app chrome band, 72px, all pages
  app_bar_ink: "#F5F1E6"         # 16.7:1 verified
  app_bar_ink2: "#A0A5A9"        # 7.6:1 verified
  app_bar_accent: "#DBAC34"      # Metallic Gold, 8.9:1 verified
  watermark: "#EFE6D0"           # oversized numeral, background art only
  well_shade: "#E9E0CC"          # soft shadow tint under wells (flat, baked)

typography:
  family_display: "Georgia, Segoe UI Semibold"
  family_body: "Segoe UI, Segoe UI"
  family_mono: "Segoe UI Semibold (numerics), Segoe UI"
  scale_pt: [28, 20, 14, 12, 10]

page_chrome: >
  v2 "Storybook App" (2026-07-14, supersedes v1 masthead): dark app bar
  72px full-width (#05131D) on every page — oversized Georgia chapter
  numeral in Metallic Gold + page title in warm white 22pt + kicker line in
  #A0A5A9; right-aligned nav chips I–V in white (current page's gold
  underline pill baked into that page's background art; never icon-only).
  Content field #F7F1E3 with pre-painted white card wells (radius 12, soft
  baked shadow), faint numeral watermark, brick-stud dot strip under the
  app bar. Footer 24px: hairline + attribution left. Identical geometry on
  all five pages via one background pipeline; P4's dark bookmark swaps in a
  full-bleed designed dark background (dark_state tokens: surface #101820,
  ink #F5F1E6, ink_secondary #A0A5A9, accent #DBAC34, hairline #2A313B).

accessibility:
  contrast: "WCAG AA on all text in BOTH theme states (verified pairs in 05-design.md)"
  color_never_alone: true

forbidden:
  - "WB trademark assets, movie stills, bootleg magic fonts"
  - "Pearl Gold #AA7F2E as text below 18pt (3.6:1 — markers only)"
  - "texture/parchment images — the parchment is a flat tint"
  - "ornament beyond: drop cap (P1), chapter rule, italic margin annotations"
  - "serif below 14pt"
