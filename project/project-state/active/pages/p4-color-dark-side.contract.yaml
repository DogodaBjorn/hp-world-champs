page_name: "IV · The Most Colorful of Them All"
date: "2026-07-13"

audience: "A1"
question: "Which HP set is the most colorful ever — and what does the opposite look like? (R5/R6)"
archetype: "detail with a bookmark-swapped dark twin state"

three_second_message: "Harry Potter is LEGO's most colorful license — Star Wars its grayest."
three_minute_path: "Rank stated precisely (#2 of 27,069 behind D&D's 56); every mark's color is the brick's own hex; dark state cites 97.9% of 1,212 parts for the grayest large STAR WARS set (never 'grayest ever' — five mosaics are 100%); theme grayness quantified (SW 71.8% vs HP 42.4%); footer attribution in both states."

hero: "hero_color_composition — true-hex bar composition of Diagon Alley Wizarding Shops 76444-1, 55 colors (SIGNED DEVIATION: Hex field-value formatting). In the dark state the same slot shows Vader's TIE Advanced 10175-1 at 97.9% gray."
