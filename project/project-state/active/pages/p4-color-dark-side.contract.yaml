    intent: "ranking — most colorful sets ever (76444-1 highlighted; light state) / grayest ≥1,000-part sets (10175-1; dark state)"
    metric_ids: ["M-004", "M-005"]
  - id: "kpi_theme_grayness"
    intent: "magnitude — HP 42.4% vs SW 71.8% grayscale share; HP 99 lifetime colors = #1 license"
